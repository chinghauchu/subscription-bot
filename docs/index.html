<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>訂閱助手 · sub-assist</title>
  <meta name="description" content="訂閱助手（sub-assist）幫你手動記錄訂閱與定期扣款，並在離職、搬家、換機、賣機時一次清點。資料留在裝置與 iCloud。" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7f6;
      --fg: #14221f;
      --muted: #4d635e;
      --card: #ffffff;
      --line: #d5e4df;
      --accent: #0f6e62;
      --accent-soft: #e5f3f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071615;
        --fg: #e7f3f0;
        --muted: #a9c4bd;
        --card: #102422;
        --line: #1e3a36;
        --accent: #7dcec2;
        --accent-soft: #16332f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    p { margin: 0.6rem 0; }
    h1 {
      font-size: 2.1rem;
      line-height: 1.2;
      margin: 0.2rem 0 0.35rem;
    }
    .en {
      margin: 0;
      color: var(--accent);
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    .lead { font-size: 1.08rem; }
    .card {
      margin-top: 1.75rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.1rem 1.2rem;
    }
    ul { margin: 0.4rem 0 0; padding-left: 1.2rem; }
    li { margin: 0.35rem 0; }
    a { color: var(--accent); }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    nav a {
      display: inline-block;
      text-decoration: none;
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-weight: 650;
    }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="en">sub-assist</p>
    <h1>訂閱助手</h1>
    <p class="lead">手動記錄訂閱與定期扣款。離職、搬家、換機或賣機時，用同一份清單把該停的項目清點完。</p>

    <div class="card">
      <p>資料寫在這台裝置，並可同步到你的 iCloud（<code>iCloud.app.subassist.tw</code>）。</p>
      <ul>
        <li>不讀銀行、信用卡明細、Gmail 或簡訊。</li>
        <li>不會登入第三方，也不會自動取消任何訂閱。</li>
        <li>核心功能免費。底部可能顯示廣告；可一次買斷 NT$60 去除廣告。</li>
      </ul>
    </div>

    <nav>
      <a href="./privacy.html">隱私權政策</a>
      <a href="./terms.html">使用條款</a>
    </nav>

    <footer>
      <p>Bundle ID：app.subassist.tw</p>
      <p><a href="https://github.com/chinghauchu/subscription-bot">GitHub</a></p>
    </footer>
  </main>
</body>
</html>
